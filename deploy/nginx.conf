# Adi Music: nginx serves the static site in site/ and proxies a handful of
# public APIs. There is no application server; all logic lives in Alpine.js.
#
# Run unprivileged from the repo root:
#   sh deploy/prepare.sh && nginx -p "$PWD/" -c deploy/nginx.conf -e run/error.log
worker_processes 1;
pid run/nginx.pid;
error_log run/error.log warn;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; }
  default_type application/octet-stream;

  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  client_body_temp_path run/tmp/body;
  proxy_temp_path run/tmp/proxy;
  fastcgi_temp_path run/tmp/fastcgi;
  uwsgi_temp_path run/tmp/uwsgi;
  scgi_temp_path run/tmp/scgi;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Upstreams are resolved lazily so the service can start before the network is up.
  resolver 127.0.0.53 valid=300s ipv6=off;
  resolver_timeout 5s;

  proxy_cache_path run/cache levels=1:2 keys_zone=upstream:10m max_size=64m inactive=7d use_temp_path=off;
  limit_req_zone $binary_remote_addr zone=upstream_rate:5m rate=10r/s;

  # URLs carrying ?v=<content hash> never change: cache them for a year. Anything else revalidates.
  map $arg_v $asset_cache_control {
    default "public, max-age=31536000, immutable";
    ""      "no-cache";
    "dev"   "no-cache";
  }

  # Precompressed Brotli without the brotli module: serve file.br when the client accepts it
  # and deploy/optimize.sh produced it. $uri ends in .br only when try_files really picked it.
  map $http_accept_encoding $br_ext {
    default "";
    "~*\bbr\b" ".br";
  }
  map $uri $br_encoding {
    default "";
    "~\.br$" "br";
  }

  server {
    include ../run/listen.conf;   # listen, root, $youtube_key, $asset_v, $public_url (generated by prepare.sh)
    server_name _;
    index index.html;
    ssi on;                       # <!--# include virtual="/partials/x.html" -->

    absolute_redirect off;        # Location: /privacy, not http://host:port/privacy (matters behind a TLS proxy)
    gzip_static on;               # serve file.gz made by deploy/optimize.sh
    error_page 404 /404.html;

    include security-headers.conf;

    location = /404.html { internal; include security-headers.conf; }

    # The home page lives at /, the privacy page at /privacy: one URL each.
    # `index index.html` makes nginx redirect / to /index.html internally; only the direct request is moved.
    location = /index.html {
      if ($request_uri = /index.html) { return 301 /; }
      expires -1;
      include security-headers.conf;
    }
    location = /privacy.html { return 301 /privacy; }
    location = /privacy/ { return 301 /privacy; }
    location = /privacy { expires -1; include security-headers.conf; try_files /privacy.html =404; }

    # Search engines: both files are templates (SSI fills in ADI_PUBLIC_URL).
    location = /sitemap.xml { expires 1h; ssi_types text/xml; include security-headers.conf; }
    location = /robots.txt { expires 1h; ssi_types text/plain; include security-headers.conf; }
    location = /llms.txt { expires 1h; ssi_types text/plain; include security-headers.conf; }

    # One shell for every client-side route of the player. Never indexed.
    location ~ ^/(library(/.*)?|discovery|settings|player)/?$ {
      expires -1;
      add_header X-Robots-Tag "noindex, nofollow" always;
      include security-headers.conf;
      try_files /app.html =404;
    }

    location /components/ {
      expires -1;
      add_header X-Robots-Tag "noindex, nofollow" always;
      include security-headers.conf;
      try_files $uri.html =404;
    }

    # The worker is a template too (SSI puts the asset version in). It and the manifest must
    # always revalidate, or updates never reach installed copies.
    location = /sw.js {
      expires -1;
      ssi_types application/javascript;
      add_header Service-Worker-Allowed "/" always;
      include security-headers.conf;
    }
    location = /manifest.webmanifest { expires -1; include security-headers.conf; }

    location /partials/ { internal; }

    # Scripts and styles: ?v= URLs are immutable. Brotli when available, then gzip_static, then plain.
    location ~ ^/assets/.+\.js$ {
      default_type application/javascript;
      add_header Cache-Control $asset_cache_control;
      add_header Content-Encoding $br_encoding;
      add_header Vary Accept-Encoding;
      gzip off;                    # nginx does not know the .br body is already encoded; gzip_static still serves .gz
      include security-headers.conf;
      try_files $uri$br_ext $uri =404;
    }
    location ~ ^/assets/.+\.css$ {
      default_type text/css;
      add_header Cache-Control $asset_cache_control;
      add_header Content-Encoding $br_encoding;
      add_header Vary Accept-Encoding;
      gzip off;                    # nginx does not know the .br body is already encoded; gzip_static still serves .gz
      include security-headers.conf;
      try_files $uri$br_ext $uri =404;
    }
    location /assets/ { add_header Cache-Control $asset_cache_control; include security-headers.conf; }

    location /fonts/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      include security-headers.conf;
    }

    # Images are referenced without a version: a day in cache, then serve stale while refreshing.
    location /images/ {
      add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
      include security-headers.conf;
    }

    location /up/ { return 404; }

    # ---------------------------------------------------------------- upstreams
    location = /up/adi/api/lyrics {
      include nginx-proxy.conf;
      set $up https://lyrics.adi.rest;
      proxy_set_header Host lyrics.adi.rest;
      proxy_ssl_name lyrics.adi.rest;
      rewrite ^/up/adi(.*)$ $1 break;
      proxy_pass $up;
      proxy_cache_valid 200 6h;
      proxy_cache_valid 404 5m;
    }

    location = /up/lrclib/api/get {
      include nginx-proxy.conf;
      set $up https://lrclib.net;
      proxy_set_header Host lrclib.net;
      proxy_ssl_name lrclib.net;
      rewrite ^/up/lrclib(.*)$ $1 break;
      proxy_pass $up;
      proxy_cache_valid 200 6h;
      proxy_cache_valid 404 5m;
    }

    location = /up/lrcmux/compat/kpoe/v2/lyrics/get {
      include nginx-proxy.conf;
      set $up https://api.lrcmux.dev;
      proxy_set_header Host api.lrcmux.dev;
      proxy_ssl_name api.lrcmux.dev;
      rewrite ^/up/lrcmux(.*)$ $1 break;
      proxy_pass $up;
      proxy_cache_valid 200 6h;
      proxy_cache_valid 404 5m;
    }

    location = /up/itunes/search {
      include nginx-proxy.conf;
      set $up https://itunes.apple.com;
      proxy_set_header Host itunes.apple.com;
      proxy_ssl_name itunes.apple.com;
      rewrite ^/up/itunes(.*)$ $1 break;
      proxy_pass $up;
      proxy_cache_valid 200 30m;
      proxy_cache_valid 404 1m;
    }

    # Innertube: YouTube's own web API, used when the Data API quota is spent or no key is set.
    # POST only, exactly this endpoint, small JSON body. The key below is the public key that
    # youtube.com itself embeds in its pages; it is not a secret.
    location = /up/innertube/search {
      include nginx-proxy-base.conf;
      limit_except POST { deny all; }
      client_max_body_size 2k;
      client_body_buffer_size 2k;
      proxy_cache_methods POST;
      proxy_cache_key "$request_uri|$request_body";
      set $up https://www.youtube.com;
      proxy_set_header Host www.youtube.com;
      proxy_set_header Origin https://www.youtube.com;
      proxy_set_header Content-Type "application/json";
      proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36";
      proxy_ssl_name www.youtube.com;
      rewrite ^ /youtubei/v1/search?prettyPrint=false break;
      proxy_pass $up;
      proxy_cache_valid 200 30m;
      proxy_cache_valid 404 1m;
    }

    # YouTube Data API: the key is appended here, server-side only.
    location ~ ^/up/youtube/(search|videos)$ {
      include nginx-proxy.conf;
      if ($youtube_key = "") { return 503; }
      set $up https://www.googleapis.com;
      set $args "$args&key=$youtube_key";
      proxy_set_header Host www.googleapis.com;
      proxy_ssl_name www.googleapis.com;
      rewrite ^/up/youtube/(.*)$ /youtube/v3/$1 break;
      proxy_pass $up;
      proxy_cache_valid 200 1h;
      proxy_cache_valid 404 1m;
    }
  }
}
